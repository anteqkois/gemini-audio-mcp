[project]
name = "gemini-audio-mcp"
version = "0.1.0"
description = "MCP server for processing audio and video files using Google's Gemini models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.1.2",
    "google-generativeai>=0.8.0",
]

[project.scripts]
gemini-audio-mcp = "gemini_audio_mcp.main:main"
