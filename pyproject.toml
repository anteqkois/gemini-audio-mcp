[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gemini-audio-mcp"
version = "0.1.5"
description = "MCP server for processing audio and video files using Google's Gemini multimodal models"
readme = "README.md"
authors = [
    { name = "Anteqkois", email = "anteqkois.dev@gmail.com" }
]
urls = { Repository = "https://github.com/anteqkois/gemini-audio-mcp" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mcp>=1.1.2",
    "google-genai>=0.1.0",
]

[project.scripts]
gemini-audio-mcp = "gemini_audio_mcp.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gemini_audio_mcp"]
